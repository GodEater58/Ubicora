name: Prove su telefono Android (emulatore)
# Every test in app/src/androidTest on a real Android emulator (encrypted archive, real screens,
# app closed and reopened). Results are attached to the run.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: device-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run every device test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest > device-tests.log 2>&1 || { tail -80 device-tests.log; exit 1; }
      - name: Show failures
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |FAILED|What went wrong|AssertionError|Exception|Tempo scaduto' -A6 device-tests.log | head -150 | sed -E 's/^/::error::/' || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-test-results
          path: |
            device-tests.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
