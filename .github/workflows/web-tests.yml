name: Ubicora Web - Browser and domain tests
on:
  push:
    branches: [main]
    paths: ['web/**', 'server/web/**', '.github/workflows/web-tests.yml']
  pull_request:
    paths: ['web/**', 'server/web/**', '.github/workflows/web-tests.yml']
permissions:
  contents: read
jobs:
  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify standalone build is current
        run: |
          python web/build.py
          git diff --exit-code -- web/Ubicora.html server/web/Ubicora.html
      - name: Domain operations, CSV and 10,000-item import
        run: node --test web/tests/core.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Actual browser - desktop, persistence, mobile and offline file
        run: |
          node web/tests/browser.cjs
          node web/tests/shared-browser.cjs
          node web/tests/resilience-browser.cjs
          node web/tests/map-browser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ubicora-web-browser-screenshots
          path: /tmp/ubicora-*.png
          retention-days: 3   # 4.20: the free plan has 500 MB for all of them
