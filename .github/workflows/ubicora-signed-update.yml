name: Ubicora Stable Signed Update
on:
  workflow_dispatch:
    inputs:
      expected_version_code:
        description: 'VersionCode presente in app/build.gradle.kts (deve crescere tra gli aggiornamenti)'
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: ubicora-stable-release
  cancel-in-progress: false
jobs:
  build-signed-update:
    name: Verify and package signed Ubicora update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK 36 and build tools
        run: |
          set -euo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Restore the existing permanent keystore, never generate another
        env:
          KEYSTORE_BASE64: ${{ secrets.UBICORA_KEYSTORE_BASE64 }}
          UBICORA_RELEASE_STORE_PASSWORD: ${{ secrets.UBICORA_STORE_PASSWORD }}
          UBICORA_RELEASE_KEY_ALIAS: ${{ secrets.UBICORA_KEY_ALIAS }}
          UBICORA_RELEASE_KEY_PASSWORD: ${{ secrets.UBICORA_KEY_PASSWORD }}
          EXPECTED_SIGNER: ${{ vars.UBICORA_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 UBICORA_RELEASE_STORE_PASSWORD UBICORA_RELEASE_KEY_ALIAS UBICORA_RELEASE_KEY_PASSWORD EXPECTED_SIGNER; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing $name. Configure the existing keystore in repository Actions secrets; no APK will be published."
              exit 1
            fi
          done
          signing_dir="$RUNNER_TEMP/ubicora-signing"
          mkdir -m 700 -p "$signing_dir"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/ubicora-keystore.jks"
          test -s "$signing_dir/ubicora-keystore.jks"
          echo "UBICORA_RELEASE_STORE_FILE=$signing_dir/ubicora-keystore.jks" >> "$GITHUB_ENV"
          echo "Using a stable signing key from Actions secrets"
      - name: Build and test signed release
        env:
          UBICORA_RELEASE_STORE_PASSWORD: ${{ secrets.UBICORA_STORE_PASSWORD }}
          UBICORA_RELEASE_KEY_ALIAS: ${{ secrets.UBICORA_KEY_ALIAS }}
          UBICORA_RELEASE_KEY_PASSWORD: ${{ secrets.UBICORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 lint testDebugUnitTest testReleaseUnitTest assembleRelease
      - name: Verify identity, exact versionCode and expected certificate
        env:
          EXPECTED_SIGNER: ${{ vars.UBICORA_SIGNING_CERT_SHA256 }}
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$apk"
          mkdir -p app/build/reports/signed-update
          "$apksigner" verify --verbose --print-certs "$apk" > app/build/reports/signed-update/apk-verification.txt
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/reports/signed-update/apk-verification.txt | sed -n '1p' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="$(printf '%s' "$EXPECTED_SIGNER" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$signer" != "$expected" ]]; then
            echo "::error::Signing certificate differs from the permanent expected fingerprint. Refusing to publish this APK."
            exit 1
          fi
          package_line="$("$aapt" dump badging "$apk" | sed -n '1p')"
          echo "$package_line" | grep -q "name='com.ubicora.app'"
          echo "$package_line" | grep -q "versionCode='$EXPECTED_VERSION_CODE'"
          {
            echo "Package: com.ubicora.app"
            echo "VersionCode: $EXPECTED_VERSION_CODE"
            echo "Signer SHA-256: $signer"
            echo "APK SHA-256: $(sha256sum "$apk" | cut -d ' ' -f 1)"
            echo "Identity validated against the configured permanent signing fingerprint."
            echo "Device install update is permitted only when the installed app uses this same signer and a compatible versionCode."
          } > app/build/reports/signed-update/RELEASE-AUDIT.txt
      - name: Upload signed UPDATE APK (never the debug artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ubicora-signed-update-code-${{ inputs.expected_version_code }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/reports/signed-update/RELEASE-AUDIT.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ubicora-signing"

  # The signed APK also lands in a DRAFT release: one tap to download it from a phone, no zip.
  # Draft releases are visible only to people with write access to the repository; publishing
  # one is a manual choice on GitHub. Only this job can write, and it never sees the keystore.
  draft-release:
    name: Put the signed APK in a draft release
    needs: build-signed-update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the verified signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ubicora-signed-update-code-${{ inputs.expected_version_code }}
          path: signed
      - name: Create or replace the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ inputs.expected_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find signed -name app-release.apk | head -n 1)"
          audit="$(find signed -name RELEASE-AUDIT.txt | head -n 1)"
          test -s "$apk" && test -s "$audit"
          name="$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versionName non leggibile"; exit 1; }
          tag="v$name"
          file="Ubicora-$name.apk"
          cp "$apk" "$file"
          # A published release is never touched; an older draft of the same version is replaced.
          if gh release view "$tag" --json isDraft --jq .isDraft > state.txt 2>/dev/null; then
            if [[ "$(cat state.txt)" != "true" ]]; then
              echo "::error::La release $tag è già pubblicata: aumenta versionCode e versionName."
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          notes="docs/CHANGELOG_${name//./_}.md"
          {
            echo "APK firmato con la chiave permanente: si installa sopra la versione precedente senza disinstallare."
            echo
            echo "- versionName: $name"
            echo "- versionCode: $VERSION_CODE"
            echo "- SHA-256 dell'APK: $(sha256sum "$file" | cut -d ' ' -f 1)"
            echo
            if [[ -f "$notes" ]]; then echo "Note: [$notes](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/$notes)"; fi
            echo
            echo "Bozza creata da GitHub Actions: visibile solo a chi può scrivere nel repository."
          } > notes.md
          gh release create "$tag" "$file" "$audit#RELEASE-AUDIT.txt" --draft --target "${{ github.sha }}" \
            --title "Ubicora $name" --notes-file notes.md
          echo "Bozza pronta: $(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
