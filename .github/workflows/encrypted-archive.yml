name: Encrypted archive (emulator)
# 4.12: runs EncryptedArchiveTest on a real Android emulator (SQLCipher needs the native library,
# which unit tests cannot load) and publishes the results on the branch encrypted-archive-output.
on:
  workflow_dispatch:
  push:
    branches: [feature/4.12.0-encrypted-db]
concurrency:
  group: encrypted-archive
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p results
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.officinastock.app.EncryptedArchiveTest > results/gradle.log 2>&1 || echo "FAILED" > results/status.txt
            adb logcat -d > results/logcat.txt || true
      - name: Publish results
        if: always()
        shell: bash
        run: |
          mkdir -p results
          [ -f results/status.txt ] || echo "PASSED" > results/status.txt
          cp -r app/build/outputs/androidTest-results results/ 2>/dev/null || true
          cp -r app/build/reports/androidTests results/reports 2>/dev/null || true
          grep -E '^e: |FAILED|What went wrong|AssertionError|Exception' -A4 results/gradle.log | head -120 > results/errors.txt || true
          grep -iE 'sqlcipher|EncryptedArchive|AndroidRuntime' results/logcat.txt | tail -200 > results/logcat-short.txt || true
          rm -f results/logcat.txt
          cd results
          git init -q -b encrypted-archive-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Encrypted archive results from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" encrypted-archive-output
