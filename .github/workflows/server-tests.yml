name: Enterprise API Security Tests
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_ephemeral_database_password
          POSTGRES_DB: ubicora_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d ubicora_ci"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: python -m pip install -r server/requirements-test.txt
      - name: Apply isolated PostgreSQL fixture and least-privilege user
        env:
          PGPASSWORD: ci_ephemeral_database_password
        run: |
          psql -h localhost -U postgres -d ubicora_ci -v ON_ERROR_STOP=1 -f server/postgresql_schema.sql
          psql -h localhost -U postgres -d ubicora_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ubicora_ci_api LOGIN PASSWORD 'ci_test_only_api_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO ubicora_ci_api;
          GRANT SELECT ON tenants,tenant_members TO ubicora_ci_api;
          GRANT SELECT,INSERT,UPDATE,DELETE ON entity_versions TO ubicora_ci_api;
          GRANT SELECT,INSERT ON accepted_events TO ubicora_ci_api;
          INSERT INTO tenants(id,display_name) VALUES
             ('11111111-1111-4111-8111-111111111111','Test Organization'),
             ('22222222-2222-4222-8222-222222222222','Other Organization');
          INSERT INTO tenant_members(tenant_id,subject,role) VALUES
             ('11111111-1111-4111-8111-111111111111','test-manager','MANAGER'),
             ('11111111-1111-4111-8111-111111111111','test-viewer','VIEWER');
          SQL
      - name: Test HTTP, OIDC guard and tenant/RLS semantics
        env:
          UBICORA_DATABASE_URL: postgresql://ubicora_ci_api:ci_test_only_api_password@localhost:5432/ubicora_ci
        run: cd server && python -m pytest tests -q
