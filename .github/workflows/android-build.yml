name: Build Android Native Debug APK (NOT UPDATABLE)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          "$SDKMGR" --version
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify SQLite contract
        run: python3 tests/sqlite_contract_test.py && python3 tests/enterprise_contract_test.py && python3 tests/photo_storage_contract_test.py && python3 tests/manager_contract_test.py && python3 tests/plan_editor_contract_test.py && python3 tests/scanner_contract_test.py && python3 tests/backup_demo_contract_test.py && python3 tests/demo_full_contract_test.py
      - name: Verify Home navigation and map viewport
        run: python3 tests/ui_navigation_map_contract_test.py
      - name: Verify compliance integration
        run: python3 tests/compliance_contract_test.py
      - name: Verify Ubicora branding and compatibility
        run: python3 tests/brand_identity_contract_test.py && python3 tests/update_signing_contract_test.py
      - name: Build and test
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --continue clean lint testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease assembleDebugAndroidTest 2>&1 | tee gradle-build.log
      - name: Report compiler and test failures as annotations
        if: failure()
        shell: bash
        run: |
          # Kotlin errors, failed tests and lint errors become readable annotations in the PR.
          grep -E '^e: ' gradle-build.log | head -40 | while IFS= read -r line; do
            loc=$(printf '%s' "$line" | sed -E 's#^e: file://[^ ]*/app/(src/[^:]+):([0-9]+):([0-9]+) .*#app/\1|\2#;t;s#.*#|#')
            echo "::error file=${loc%%|*},line=${loc##*|}::${line:0:900}"
          done
          grep -E ' FAILED$' -A4 gradle-build.log | head -80 | sed -E 's/^/::error::/' || true
          grep -E 'Lint found [0-9]+ errors|^> Task .* FAILED|What went wrong' -A3 gradle-build.log | head -30 | sed -E 's/^/::error::/' || true
          find app/build/test-results -name 'TEST-*.xml' -exec grep -l '<failure' {} + 2>/dev/null | while read -r f; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for failure in case.findall('failure'):
                  msg=(failure.get('message') or failure.text or '').replace('\n',' ')[:700]
                  print(f"::error::{case.get('classname')}.{case.get('name')}: {msg}")
          PY
          done
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Record resolved runtime dependencies
        run: |
          mkdir -p app/build/reports/compliance
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > app/build/reports/compliance/debugRuntimeClasspath.txt
      - uses: actions/upload-artifact@v4
        with:
          name: officina-stock-compliance-runtime-inventory
          path: app/build/reports/compliance/debugRuntimeClasspath.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ubicora-DEBUG-do-not-use-for-updates
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
