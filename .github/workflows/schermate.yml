name: Schermate
# Renders the real app screens with the demo warehouse (Robolectric) for the README and the guide,
# and publishes the PNGs, the log and the test report on the branch schermate-output.
on:
  workflow_dispatch:
  push:
    branches: [docs/4.20.2-repo-aggiornato]
    paths:
      - 'app/src/test/java/com/officinastock/app/ReadmeScreenshotsTest.kt'
      - '.github/workflows/schermate.yml'
concurrency:
  group: schermate
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          # 4.25: the Android images Robolectric downloads from Maven Central (~/.m2) are kept between runs,
          # so a Maven Central hiccup no longer fails every test.
          cache: maven
          cache-dependency-path: app/build.gradle.kts
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Render screens
        shell: bash
        run: |
          chmod +x ./gradlew
          mkdir -p shots
          export UBICORA_SCREENSHOTS="$PWD/shots"
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.officinastock.app.ReadmeScreenshotsTest' 2>&1 | tee shots/gradle.log || true
          cp app/build/test-results/testDebugUnitTest/TEST-com.officinastock.app.ReadmeScreenshotsTest.xml shots/ 2>/dev/null || true
          grep -E '^e: |FAILED|What went wrong' -A3 shots/gradle.log | head -60 > shots/errors.txt || true
      - name: Publish on schermate-output
        shell: bash
        run: |
          cd shots
          git init -q -b schermate-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Schermate da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" schermate-output
